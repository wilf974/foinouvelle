services:
  foi-nouvelle:
    build: .
    container_name: foi-nouvelle
    # Ne pas exposer le port publiquement en production (seulement via Nginx)
    ports:
      - "127.0.0.1:2000:2000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - foi-nouvelle-network
    # Limites de ressources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  foi-nouvelle-network:
    driver: bridge

