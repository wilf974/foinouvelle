services:
  foi-nouvelle:
    build: .
    container_name: foi-nouvelle
    # Ne pas exposer le port publiquement en production (seulement via Nginx)
    ports:
      - "127.0.0.1:2000:2000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - foi-nouvelle-network
    # Volumes pour persister les données (versets et base de données)
    volumes:
      - ./weekly-verse.json:/app/weekly-verse.json
      - ./verses-archive.json:/app/verses-archive.json
      - ./foi-nouvelle.db:/app/foi-nouvelle.db
    # Limites de ressources
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

networks:
  foi-nouvelle-network:
    driver: bridge


